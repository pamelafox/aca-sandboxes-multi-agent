# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
#
# `azd up` workflow for the Research Agent Swarm:
#
#   1. `azd up`
#        - Provisions infra/main.bicep (ACR, AOAI, ACA env, sandbox group, orchestrator app, role assignments)
#        - Builds & pushes the orchestrator image to ACR (server-side via `az acr build`)
#        - Builds & pushes the research-agent image to ACR (via the postprovision hook)
#        - Builds & pushes the sandbox-agent image and stores its reference in azd
#        - Deploys the orchestrator image to the Container App
#
#   2. First request to the orchestrator
#        - Lifespan startup pre-warms a disk image from `acr/research-agent:latest`
#        - Subsequent runs reuse the disk image (digest-cached)
#
# To redeploy code only:  `azd deploy`
# To rebuild infra only:  `azd provision`
# To tear down:           `azd down`

name: aca-sandboxes-agents
metadata:
  template: aca-sandboxes-agents@1.0.0

infra:
  provider: bicep
  path: infra
  module: main

services:
  orchestrator:
    project: ./orchestrator
    language: python
    host: containerapp
    docker:
      path: Dockerfile
      context: .
      remoteBuild: true
      registry: ${AZURE_CONTAINER_REGISTRY_ENDPOINT}

hooks:
  # After infra is provisioned, build & push the research-agent and sandbox-agent images to ACR.
  # The orchestrator image is built+pushed automatically by `azd deploy` because
  # it's listed under `services` above.
  postprovision:
    posix:
      shell: sh
      run: |
        set -e
        bash research-agent/build.sh
        bash sandbox-agent/build.sh
    windows:
      shell: pwsh
      run: |
        pwsh -NoProfile -File research-agent/build.ps1
        if ($LASTEXITCODE -ne 0) { throw "research-agent build failed with exit code $LASTEXITCODE" }
        pwsh -NoProfile -File sandbox-agent/build.ps1
        if ($LASTEXITCODE -ne 0) { throw "sandbox-agent build failed with exit code $LASTEXITCODE" }
